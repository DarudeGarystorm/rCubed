name: Package and Test macOS

on:
    workflow_call:
        inputs:
            version:
                type: string
                required: true
            swf-artifact:
                type: string
                required: true
            release-tag:
                type: string
                default: ""
        secrets:
            AIR_SDK_LICENSE_FILE:
                required: false

jobs:
    package:
        runs-on: macos-15-intel
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5.0.0
              with:
                  lfs: true
            - name: Set SDK location
              run: echo "AIR_SDK=$RUNNER_TEMP/air-sdk-51.4.1.1" >> "$GITHUB_ENV"
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"
            - uses: actions/download-artifact@v4
              with:
                  name: ${{ inputs.swf-artifact }}
                  path: macos-input
            - uses: actions/cache@v4
              with:
                  path: ${{ runner.temp }}/air-sdk-51.4.1.1
                  key: macos-air-sdk-51.4.1.1-855dd09ed31e368ac604ef187801981e2e280df7edd12416d422b11a24911269
            - name: Set up universal Mac AIR SDK
              run: bash scripts/setup-macos-sdk.sh "$AIR_SDK"
            - name: Install optional AIR SDK license
              env:
                  LICENSE_BASE64: ${{ secrets.AIR_SDK_LICENSE_FILE }}
              run: |
                  if [[ -n "$LICENSE_BASE64" ]]; then
                      mkdir -p "$HOME/.airsdk"
                      printf '%s' "$LICENSE_BASE64" | base64 --decode > "$HOME/.airsdk/adt.lic"
                  fi
            - name: Package universal application
              env:
                  VERSION: ${{ inputs.version }}
              run: bash scripts/package-macos.sh "$AIR_SDK" macos-input/R3Air.swf "$VERSION" macos-output
            - uses: actions/upload-artifact@v4
              with:
                  name: macos-universal
                  path: macos-output/*.zip
                  if-no-files-found: error

    smoke-test:
        needs: package
        strategy:
            fail-fast: false
            matrix:
                runner: [macos-15-intel, macos-15]
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v5.0.0
            - uses: actions/download-artifact@v4
              with:
                  name: macos-universal
                  path: macos-output
            - name: Extract application
              run: ditto -x -k macos-output/*.zip macos-app
            - name: Test native application startup
              run: bash scripts/smoke-test-macos.sh macos-app/R3.app

    upload-release:
        if: inputs.release-tag != ''
        needs: [package, smoke-test]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: macos-universal
                  path: macos-output
            - name: Attach verified Mac package to the existing draft release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.release-tag }}
              run: gh release upload "$RELEASE_TAG" macos-output/*.zip --clobber
